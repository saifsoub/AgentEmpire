name: AgentEmpire Validation

on:
  pull_request:
    paths:
      - "lib/**"
      - "__tests__/**"
      - "docs/**"
      - "package.json"
      - "package-lock.json"
      - "Dockerfile"
      - ".github/workflows/ci.yml"
  push:
    branches:
      - "seif/doneai-99-team-will-finish-the-whole-city-in-less-than-the-sla-1c99"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Verify
        run: npm run deploy:verify
